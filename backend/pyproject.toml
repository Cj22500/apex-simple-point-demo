[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-point-lite"
version = "0.1.0"
description = "Simple-Point Lite backend: point cloud ingestion, survey analysis, CRS and CAD/SIMA interop"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "laspy[lazrs]>=2.5",
  "pyproj>=3.7",
  "ezdxf>=1.3",
  "plyfile>=1.0",
  "pillow>=10",
  "piexif>=1.1",
  "pye57>=0.4",
  "rasterio>=1.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "hypothesis>=6"]
sfm = ["pycolmap>=3.10"]
postgres = ["psycopg[binary]>=3.2"]
aws = ["boto3>=1.35"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
  "slow: long-running tests (large synthetic datasets)",
  "network: tests that need internet access",
]
